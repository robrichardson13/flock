<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- #9 asked for `interactive-widget=resizes-content` so the browser would shrink the
         *layout* viewport for the keyboard and `visualViewport.offsetTop` would never leave
         0. #11 confirmed from the source that WebKit does not implement it and has not taken
         a position on it (bug 259770, open and unassigned; nothing in the Safari 26 release
         notes), and Chrome on iOS is WebKit too — so on every browser this app is reported
         broken in, the key did nothing. #13 dropped it: a viewport key that is dead on the
         only platform with the bug is a line the next reader has to disprove again. The iOS
         fix is `focus({ preventScroll: true })` on an intercepted tap (focus.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- iOS 26 ignores theme-color and samples the page's own background instead (see the
         phone rules in styles.css); this meta is for Android and desktop Chrome, and
         theme-color.ts rewrites it to the computed chrome colour of the live scheme. -->
    <meta name="theme-color" content="#191919" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="flock" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%235b9cf6'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-size='15' font-weight='700' fill='white' font-family='sans-serif'%3Ef%3C/text%3E%3C/svg%3E" />
    <title>flock</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

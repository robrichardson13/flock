name: ci

# The PR gate: typecheck, test, and a build smoke check on every pull request.
#
# Triggers on pull_request only, deliberately not push:main — release.yml's `test` job already
# runs `bun test` + `bun run typecheck` on every push to main, so a push:main trigger here would
# be a pure duplicate of that job on the same commits. PRs are the actual gap this workflow closes.
# install-test.yml already runs on push + pull_request too, but does unrelated work (shellcheck +
# installer e2e against a fake release) — no logic overlap with what this workflow checks.
#
# Single job, no matrix: release.yml already covers the real cross-platform build matrix; this
# workflow is about correctness of source, not of platform-specific binaries.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.4"

jobs:
  test:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        env:
          # Turns on the self-update end-to-end in packages/cli/src/update.test.ts. It builds two
          # real release binaries and updates one into the other over a file:// release base:
          # hermetic, no network, ~7s total.
          FLOCK_E2E: "1"
        run: bun test
      - name: Build
        run: bun run build
